services:
  - type: web
    name: ai-knowledge-inbox-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: npm install -g bun@1.4.4 && bun install --frozen-lockfile && bun run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
